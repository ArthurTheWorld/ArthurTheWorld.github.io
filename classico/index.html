<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfólio</title>
  <meta name="description" content="Portfólio pessoal">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu"><i class="bi bi-list"></i></button>

  <!-- Barra lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="perfil">
      <div class="avatar" id="avatar"></div>
      <h1 id="sidebarNome"></h1>
      <div class="redes" id="redes"></div>
    </div>
    <nav>
      <a href="#inicio" class="ativo"><i class="bi bi-house"></i> Início</a>
      <a href="#sobre"><i class="bi bi-person"></i> Sobre</a>
      <a href="#habilidades"><i class="bi bi-stars"></i> Habilidades</a>
      <a href="#curriculo"><i class="bi bi-file-earmark-text"></i> Currículo</a>
      <a href="#projetos"><i class="bi bi-grid"></i> Projetos</a>
      <a href="#servicos"><i class="bi bi-briefcase"></i> Serviços</a>
      <a href="#contato"><i class="bi bi-envelope"></i> Contato</a>
    </nav>
  </aside>

  <main>
    <!-- Início -->
    <section id="inicio" class="hero">
      <div class="hero-conteudo">
        <h2 id="heroNome"></h2>
        <p class="digitando">Sou <span id="digitado"></span><span class="cursor">|</span></p>
      </div>
    </section>

    <!-- Sobre -->
    <section id="sobre">
      <div class="titulo-secao"><h2>Sobre</h2></div>
      <p id="resumo" class="lead"></p>
      <div class="sobre-grid">
        <div>
          <h3 id="sobreTitulo"></h3>
          <p id="destaque"></p>
          <ul class="info" id="info"></ul>
        </div>
      </div>
      <div class="numeros" id="numeros"></div>
    </section>

    <!-- Habilidades -->
    <section id="habilidades" class="alt">
      <div class="titulo-secao"><h2>Habilidades</h2></div>
      <div class="barras" id="barras"></div>
    </section>

    <!-- Currículo -->
    <section id="curriculo">
      <div class="titulo-secao"><h2>Currículo</h2></div>
      <div class="curriculo-grid">
        <div>
          <h3 class="subtitulo">Formação</h3>
          <div class="linha-tempo" id="formacao"></div>
        </div>
        <div>
          <h3 class="subtitulo">Experiência</h3>
          <div class="linha-tempo" id="experiencias"></div>
        </div>
      </div>
    </section>

    <!-- Projetos -->
    <section id="projetos" class="alt">
      <div class="titulo-secao"><h2>Projetos</h2></div>
      <div class="filtros" id="filtros"></div>
      <div class="projetos-grid" id="projetosGrid"></div>
    </section>

    <!-- Serviços -->
    <section id="servicos">
      <div class="titulo-secao"><h2>Serviços</h2></div>
      <div class="servicos-grid" id="servicosGrid"></div>
    </section>

    <!-- Contato -->
    <section id="contato" class="alt">
      <div class="titulo-secao"><h2>Contato</h2></div>
      <div class="contato-grid">
        <div class="contato-info" id="contatoInfo"></div>
        <form id="formContato">
          <div class="linha">
            <input name="nome" placeholder="Seu nome" required>
            <input name="email" type="email" placeholder="Seu email" required>
          </div>
          <input name="assunto" placeholder="Assunto" required>
          <textarea name="mensagem" rows="6" placeholder="Mensagem" required></textarea>
          <button type="submit">Enviar mensagem</button>
          <p class="status" id="statusForm"></p>
        </form>
      </div>
    </section>

    <footer>
      <p>© <span id="ano"></span> <span id="rodapeNome"></span>. Todos os direitos reservados.</p>
    </footer>
  </main>

  <script src="../dados.js"></script>
  <script src="../script.js"></script>
</body>
</html>
